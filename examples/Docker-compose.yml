# this file represents all services that
# are used when running nabu examples
# not all of these are required to run nabu
# they are grouped together for convenience

services:

  jaeger:
    image: jaegertracing/all-in-one
    container_name: jaeger
    restart: unless-stopped
    environment:
      LOG_LEVEL: debug
    ports:
      - "16686:16686"
      - "4317:4317"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      # the chainguard image has no curl; mc is included and checks the same health endpoint
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  minio_data:
